<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b224ef"/>
      <stop offset="100%" stop-color="#7579ff"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7579ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes flowNodes {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillLag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes wavePulse {
      0% { r: 18px; opacity: 0.9; }
      100% { r: 55px; opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 950px 220px; }
    .data-flow { stroke-dasharray: 12, 12; animation: flowNodes 6s linear infinite; }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillLag 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
    .signal-ring { animation: wavePulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .signal-ring-delay { animation: wavePulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.5s; }
  </style>

  <!-- Card Background -->
  <rect width="1196" height="336" x="2" y="2" rx="20" ry="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-1">
    <circle cx="220" cy="110" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>
  </g>
  <g class="orb-2">
    <circle cx="980" cy="200" r="160" fill="#7579ff" opacity="0.14" filter="url(#glow)"/>
  </g>

  <!-- Subtle IoT Circuit / Mesh Wire Grid in Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.45">
    <line x1="80" y1="50" x2="1120" y2="50" />
    <line x1="80" y1="290" x2="1120" y2="290" />
    <line x1="120" y1="50" x2="120" y2="290" stroke-dasharray="4,8" />
    <line x1="1080" y1="50" x2="1080" y2="290" stroke-dasharray="4,8" />
    <!-- Dynamic Animated Data Stream Lines -->
    <path d="M 120 170 L 300 170 L 360 230 L 840 230 L 900 170 L 1080 170" fill="none" stroke="url(#glowLine)" stroke-width="2" class="data-flow"/>
    <path d="M 200 90 L 320 90 L 380 150 L 820 150 L 880 90 L 1000 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="8,8" />
  </g>

  <!-- Left Side IoT Smart Hub Node with Animated Radio Waves -->
  <g transform="translate(130, 170)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00f2fe" stroke-width="2" class="signal-ring"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" class="signal-ring-delay"/>
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5" filter="url(#softGlow)"/>
    <!-- Smart Hub Icon (House / Sensor Dot) -->
    <polygon points="0,-8 -9,0 -6,0 -6,8 6,8 6,0 9,0" fill="#00f2fe"/>
  </g>

  <!-- Right Side IoT Mesh Node -->
  <g transform="translate(1070, 170)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#7579ff" stroke-width="2" class="signal-ring"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#b224ef" stroke-width="1.5" class="signal-ring-delay"/>
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#7579ff" stroke-width="2.5" filter="url(#softGlow)"/>
    <!-- Microcontroller / Chip Icon -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#7579ff"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- Floating Dynamic Tech Tags / Badges (Kept in Background / Sides to protect Foreground Title) -->
  <g class="pill-1" transform="translate(260, 48)">
    <rect width="110" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
    <text x="55" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📡 Matter &amp; Thread</text>
  </g>
  <g class="pill-2" transform="translate(830, 48)">
    <rect width="105" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.85"/>
    <text x="52" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Local First</text>
  </g>
  <g class="pill-3" transform="translate(545, 48)">
    <rect width="115" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.85"/>
    <text x="57" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔄 MQTT &amp; ESP32</text>
  </g>

  <!-- FOREGROUND: Main Titles (Crisp, High Contrast, Guaranteed Foreground Legibility) -->
  <g id="foreground-content">
    <!-- Super Title / Category Badge -->
    <text x="600" y="118" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
    
    <!-- Main Headline Title -->
    <text x="600" y="168" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" text-anchor="middle" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.8))">
      Smart Home &amp; IoT Automation
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="206" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
      Self-Hosted Hubs • Local Automation Engines • Custom Microcontrollers &amp; Cloud Platforms
    </text>

    <!-- Bottom Feature Bar -->
    <g transform="translate(600, 260)">
      <line x1="-320" y1="0" x2="320" y2="0" stroke="url(#glowLine)" stroke-width="1.5"/>
      <text x="0" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" letter-spacing="1" text-anchor="middle">
        HOME ASSISTANT • ESPHOME • TASMOTA • NODE-RED • ZIGBEE2MQTT • FRIGATE • MATTER • THINGSBOARD
      </text>
    </g>
  </g>
</svg>